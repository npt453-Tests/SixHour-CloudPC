
name: Stop Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deallocate Windows VM
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          az vm deallocate \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME"
            
